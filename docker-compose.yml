services:
  db:
    image: postgis/postgis:15-3.3
    container_name: unihome-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unihome}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password1234}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/unihome.sql:/docker-entrypoint-initdb.d/unihome.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unihome}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unihome-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: unihome-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    env_file:
      - ./ai-service/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHAT_HISTORY_TTL_SECONDS: ${CHAT_HISTORY_TTL_SECONDS:-3600}
      CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-10}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://api:8080}
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (openssl rand -hex 32)}"
      CHATBOT_TOOL_TIMEOUT_S: ${CHATBOT_TOOL_TIMEOUT_S:-15}
      CHATBOT_TOOL_MAX_TURNS: ${CHATBOT_TOOL_MAX_TURNS:-3}
      CHATBOT_TOOL_MAX_RESULTS: ${CHATBOT_TOOL_MAX_RESULTS:-20}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unihome-api
    ports:
      - "${BACKEND_PORT:-8095}:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-unihome}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password1234}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      PYTHON_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlLWtleS1mb3ItdW5paG9tZS0zMi1ieXRlcy0xMjM0NTY3ODkw}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (openssl rand -hex 32)}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unihome-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8095}
    # Bind-mount the source so Vite picks up host edits with HMR.
    # node_modules is a named volume so it stays inside the container
    # (avoids host OS mismatches like Windows-vs-Alpine native modules).
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
