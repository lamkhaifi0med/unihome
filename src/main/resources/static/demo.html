<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UniHome API Interactive Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7f7; }
    h1 { margin-bottom: 6px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; flex: 1 1 360px; }
    label { display: block; margin-top: 8px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; }
    button { margin-top: 12px; padding: 10px 16px; }
    pre { background: #f2f2f2; padding: 12px; overflow: auto; max-height: 280px; }
    .status { font-weight: bold; }
  </style>
</head>
<body>
  <h1>UniHome API Interactive Demo</h1>
  <p>This page tests the ready endpoints using Basic Auth.</p>

  <div class="row">
    <div class="box">
      <h2>Auth</h2>
      <label>Username</label>
      <input id="username" value="admin" />
      <label>Password</label>
      <input id="password" type="password" value="admin" />
      <p>If the page is protected, your browser may prompt for Basic Auth.</p>
    </div>

    <div class="box">
      <h2>GET /api/annonces/recherche</h2>
      <button onclick="runGet()">Run GET</button>
      <div class="status" id="getStatus"></div>
      <pre id="getOutput"></pre>
    </div>
  </div>

  <div class="box">
    <h2>POST /api/annonces/publier</h2>
    <label>Logement ID (required)</label>
    <div class="row">
      <input id="logementId" placeholder="UUID" />
      <button type="button" onclick="fillLogementId()">Auto Fill Logement ID</button>
    </div>

    <label>Titre</label>
    <input id="titre" value="Studio Test" />

    <label>Description</label>
    <textarea id="description">Appartement meuble test</textarea>

    <label>Loyer</label>
    <input id="loyer" type="number" value="500" />

    <label>Charges incluses</label>
    <select id="chargesIncluses">
      <option value="true" selected>true</option>
      <option value="false">false</option>
    </select>

    <label>Contact plateforme</label>
    <select id="plateforme">
      <option value="TELEPHONE" selected>TELEPHONE</option>
      <option value="WHATSAPP">WHATSAPP</option>
      <option value="EMAIL">EMAIL</option>
      <option value="FACEBOOK">FACEBOOK</option>
      <option value="INSTAGRAM">INSTAGRAM</option>
    </select>

    <label>Contact valeur</label>
    <input id="valeur" value="0612345678" />

    <label>Photos (2 minimum)</label>
    <input id="photos" type="file" multiple />

    <button onclick="runPost()">Run POST</button>
    <div class="status" id="postStatus"></div>
    <pre id="postOutput"></pre>
  </div>

  <script>
    function authHeader() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const token = btoa(user + ':' + pass);
      return { 'Authorization': 'Basic ' + token };
    }

    async function runGet() {
      const statusEl = document.getElementById('getStatus');
      const outputEl = document.getElementById('getOutput');
      statusEl.textContent = 'Loading...';
      outputEl.textContent = '';

      try {
        const res = await fetch('/api/annonces/recherche', { headers: authHeader() });
        const text = await res.text();
        statusEl.textContent = 'Status: ' + res.status;
        outputEl.textContent = text;
      } catch (err) {
        statusEl.textContent = 'Error';
        outputEl.textContent = String(err);
      }
    }

    async function runPost() {
      const statusEl = document.getElementById('postStatus');
      const outputEl = document.getElementById('postOutput');
      statusEl.textContent = 'Loading...';
      outputEl.textContent = '';

      const logementId = document.getElementById('logementId').value.trim();
      if (!logementId) {
        statusEl.textContent = 'Error: logementId is required.';
        return;
      }

      const form = new FormData();
      form.append('titre', document.getElementById('titre').value);
      form.append('description', document.getElementById('description').value);
      form.append('loyer', document.getElementById('loyer').value);
      form.append('chargesIncluses', document.getElementById('chargesIncluses').value);
      form.append('contacts[0].plateforme', document.getElementById('plateforme').value);
      form.append('contacts[0].valeur', document.getElementById('valeur').value);

      const files = document.getElementById('photos').files;
      for (let i = 0; i < files.length; i++) {
        form.append('photos', files[i]);
      }

      try {
        const res = await fetch('/api/annonces/publier?logementId=' + encodeURIComponent(logementId), {
          method: 'POST',
          headers: authHeader(),
          body: form
        });
        const text = await res.text();
        statusEl.textContent = 'Status: ' + res.status;
        outputEl.textContent = text;
      } catch (err) {
        statusEl.textContent = 'Error';
        outputEl.textContent = String(err);
      }
    }

    async function fillLogementId() {
      const statusEl = document.getElementById('postStatus');
      try {
        const res = await fetch('/api/annonces/recherche', { headers: authHeader() });
        if (!res.ok) {
          statusEl.textContent = 'Error: cannot fetch annonces (' + res.status + ')';
          return;
        }
        const data = await res.json();
        if (!data || !data.length || !data[0].logementId) {
          statusEl.textContent = 'Error: no logementId found in annonces.';
          return;
        }
        document.getElementById('logementId').value = data[0].logementId;
        statusEl.textContent = 'Logement ID auto-filled.';
      } catch (err) {
        statusEl.textContent = 'Error: ' + String(err);
      }
    }
  </script>
</body>
</html>
